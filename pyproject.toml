[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multi-ci-tools"
version = "0.1.0"
description = "CI-agnostic Python SDK for unified pipeline execution across Jenkins, GitHub Actions, and local environments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Manprit Singh", email = "manpritsingh.mod@gmail.com" }
]
keywords = ["ci", "cd", "jenkins", "github-actions", "maven", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/manpritsingh-mod/multi-ci-tool"
Repository = "https://github.com/manpritsingh-mod/multi-ci-tool"
Issues = "https://github.com/manpritsingh-mod/multi-ci-tool/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["multi_ci_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["multi_ci_tools"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
