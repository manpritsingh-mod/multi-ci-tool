name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-adapters:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/actions-setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          
      - name: Test inspect-env (Adapter Detection)
        run: |
          python -m multi_ci_tools inspect-env
          
      - name: Test dry-run
        run: |
          python -m multi_ci_tools dry-run
